# CI for @catheadowl/dsh-eval
#
# Tier-A pipeline: the two release gates + bilingual README pairing, green on
# a clean clone with `pnpm i`. The full suite is deferred (Tier C): its four
# review-adapter tests spawn the dsh CLI through the resolution chain
# (`--repo` flag > node_modules resolution layer > legacy config repo key,
# see docs/host-wiring.md), and wiring a dsh CLI into CI is deferred until the
# host dev surface has a published artifact (upstream proposal "host dev
# surface publication"; see the dsh-extra control repo's
# workunits/github-release note "CI 分层与暂缓决策"). Until then the full
# suite is verified locally:
#   - run: pnpm test
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      # Deterministic subset: release gates + README pairing (no dsh CLI needed):
      - run: pnpm verify:publish
      - run: pnpm verify:face
      - run: pnpm verify:readme-i18n
